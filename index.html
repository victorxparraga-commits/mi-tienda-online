<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda SV</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; text-align: center; }
        header { background-color: #111; color: #fff; padding: 20px; font-size: 24px; font-weight: bold; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; padding: 20px; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: 15px; width: 280px; padding: 15px; text-align: center; }
        .card img { width: 100%; border-radius: 8px; height: 200px; object-fit: cover; }
        .price { font-size: 20px; color: #27ae60; font-weight: bold; margin: 10px 0; }
        .btn-ws { display: inline-block; background-color: #25d366; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <header>Mi Tienda SV</header>

    <div class="container">
        <div class="card">
            <img src="https://via.placeholder.com/250" alt="Producto">
            <h3>Nombre del Producto</h3>
            <p>Descripción corta del producto y sus beneficios.</p>
            <div class="price">$25.00</div>
            <a href="https://wa.me/50375089722?text=Hola,%20quiero%20comprar%20este%20producto" class="btn-ws" target="_blank">Pedir por WhatsApp</a>
        </div>
    </div>

</body>
</html>
